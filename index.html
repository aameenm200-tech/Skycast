<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast</title>
    <link rel="icon" type="image/x-icon" href="./Images/weather-favicon.png">

    <!-- bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <!-- google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
    <!-- stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Background Decoration -->

    <div class="background-decoration">
        <div class="cloud cloud-left"></div>
        <div class="cloud cloud-right"></div>

        <div class="mountains"></div>

        <div class="bottom-decoration left-decoration">
            🌿
        </div>

        <div class="bottom-decoration right-decoration">
            🌿
        </div>
    </div>

    <!-- Header -->

<nav class="navbar navbar-expand-lg bg-body-tertiary ">
  <div class="container-fluid ">
    
      <a href="#" class="navbar-brand logo">
                <div class="logo-icon">
                    <i class="bi bi-cloud-sun-fill"></i>
                </div>

                <span>SKY<span class="logo-blue">CAST</span></span>
            </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse justify-content-center navbar-collapse " id="navbarTogglerDemo02">
      <ul class="navbar-nav  mb-2 mb-lg-0 ">
        <li class="nav-item">
          <a class="nav-link navlink" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a  class="nav-link navlink"  href="#weather-details">WeatherDetails</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

    <!-- Main -->

    <main class="main-container">
        <div class="d-flex justify-content-center mb-3">
            <!-- Search -->
            <form class="search-form">

                <i class="bi bi-search search-icon"></i>

                <input onkeydown="if(event.key === 'Enter') { event.preventDefault(); getWeatherDetails(); }"
                    id="cityInput" value="kakkanad" class="" type="text" placeholder="Search city..."
                    aria-label="Search city">

                <button onclick="getWeatherDetails()" type="button" aria-label="Search">
                    <i class="bi bi-search"></i>
                </button>

            </form>
        </div>

        <section class="weather-card">
            <div class="weather-detail">

                <div class="location">
                    <i class="bi bi-geo-alt-fill location-icon"></i>

                    <div>
                        <h2 id="cityname"></h2>
                        <div class="date-time">
                            <p id="date" class="date mx-2"></p>

                            <span>•</span>
                            <p id="time" class="mx-2"></p>


                        </div>


                    </div>
                </div>

                <div id="temperature" class="temperature">
                    <span></span>
                </div>

                <h3 id="weather-description" class="weather-description"></h3>

                <p id="feels-like" class="feels-like"></p>

            </div>


            <div class="sun-time-container">
                <div class="sun-time">
                    <i class="bi bi-sunrise-fill"></i>
                    <div>
                        <p>Sunrise</p>
                        <h4 id="sunrise">--:-- AM</h4>
                    </div>
                </div>

                <hr>

                <div class="sun-time">
                    <i class="bi bi-sunset-fill"></i>
                    <div>
                        <p>Sunset</p>
                        <h4 id="sunset">--:-- PM</h4>
                    </div>
                </div>
            </div>

        </section>

        <section class="weather-stats">

            <!-- Humidity -->
            <article class="stat-card">

                <div class="stat-icon">
                    <i class="bi bi-droplet-fill"></i>
                </div>

                <div class="stat-info">
                    <p>Humidity</p>
                    <h3 id="humidity"></h3>
                </div>

            </article>
            <!-- WIND -->
            <article class="stat-card">

                <div class="stat-icon">
                    <i class="bi bi-wind"></i>
                </div>

                <div class="stat-info">
                    <p>Wind</p>
                    <h3 id="wind"></h3>
                </div>

            </article>
            <!-- PRESSURE -->
            <article class="stat-card">

                <div class="stat-icon">
                    <i class="bi bi-speedometer2"></i>
                </div>

                <div class="stat-info">
                    <p>Pressure</p>
                    <h3 id="pressure"></h3>
                </div>

            </article>
            <!-- VISIBILITY -->
            <article class="stat-card">

                <div class="stat-icon">
                    <i class="bi bi-eye"></i>
                </div>

                <div class="stat-info">
                    <p>Visibility</p>
                    <h3 id="visibility"></h3>
                </div>

            </article>
        </section>

        <section id="weather-details" class="weather-details">

            <h2>Weather Details</h2>
            <div class="detail-container">
                <article class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-thermometer"></i>
                    </div>

                    <div class="detail-info">
                        <p>Temperature Range</p>
                        <h3 id="temp-range"></h3>
                    </div>

                </article>

                <article class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-cloud-fill"></i>
                    </div>

                    <div class="detail-info">
                        <p>Cloud Cover</p>
                        <h3 id="cloud-cover"></h3>
                    </div>

                </article>
            </div>

        </section>



    </main>

    <script src="./script.js"></script>
    <!-- bootstrap script -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
